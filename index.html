<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jin Scramble</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* SPIDER-VERSE COLOR PALETTE */
        :root { 
            --bg-deep: #0B0C10; 
            --panel-bg: #1A1A2E; 
            --neon-pink: #FF007F; 
            --neon-cyan: #00F0FF; 
            --text-light: #E0E0E0;
            --white: #FFFFFF;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-deep); 
            /* Subtle halftone dot background pattern */
            background-image: radial-gradient(rgba(0, 240, 255, 0.1) 1px, transparent 1px);
            background-size: 10px 10px;
            color: var(--text-light); 
            margin: 0; 
            height: 100dvh; 
            display: flex; 
            flex-direction: column;
            overflow: hidden;
        }

        /* Screen Management */
        .screen { display: none; flex-direction: column; align-items: center; width: 100%; height: 100%; padding: 20px; }
        .active { display: flex; }

        /* HEADER & CONTROLS */
        .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; margin-bottom: 20px; border-bottom: 2px solid rgba(255, 0, 127, 0.3); }
        .stat-box { font-size: 0.8rem; letter-spacing: 1px; color: var(--neon-cyan); text-transform: uppercase; font-weight: bold; }
        .stat-val { color: var(--white); font-size: 1.1rem; text-shadow: -1px 0 var(--neon-cyan), 1px 0 var(--neon-pink); }
        
        .icon-btn { background: none; border: 1px solid rgba(255,255,255,0.2); color: var(--white); padding: 8px 12px; border-radius: 8px; font-size: 1.2rem; cursor: pointer; transition: 0.2s; }
        .icon-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.1); }
        .music-off { opacity: 0.5; }

        /* HOME SCREEN UI */
        .title-container { margin-top: 40px; margin-bottom: 30px; text-align: center; }
        .title { 
            font-size: 3.5rem; font-weight: 900; font-style: italic; color: var(--white); 
            letter-spacing: -2px; margin: 0; line-height: 1;
            /* Chromatic Aberration Text Effect */
            text-shadow: -3px 0 var(--neon-cyan), 3px 0 var(--neon-pink);
        }
        .subtitle { font-size: 1rem; font-weight: bold; letter-spacing: 5px; color: var(--neon-cyan); margin-top: 5px; }

        .leaderboard { 
            width: 100%; max-width: 350px; background: rgba(26, 26, 46, 0.8); 
            border-radius: 12px; padding: 20px; margin-bottom: 30px; 
            border: 1px solid var(--neon-pink); box-shadow: 0 4px 15px rgba(255, 0, 127, 0.2);
        }
        .leaderboard-title { font-size: 0.9rem; font-weight: bold; letter-spacing: 2px; color: var(--neon-pink); margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .rank-item { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 1rem; font-weight: 600; }
        .rank-name { color: var(--text-light); }
        .rank-score { color: var(--neon-cyan); }

        input { 
            width: 100%; max-width: 350px; background: rgba(0,0,0,0.5); border: 2px solid var(--neon-cyan); 
            color: var(--white); padding: 15px; border-radius: 8px; font-size: 1.1rem; 
            text-align: center; margin-bottom: 15px; outline: none; font-weight: bold; transition: 0.2s;
        }
        input:focus { border-color: var(--neon-pink); box-shadow: 0 0 10px rgba(255, 0, 127, 0.3); }
        input::placeholder { color: rgba(255,255,255,0.4); font-weight: normal; }

        .play-btn { 
            width: 100%; max-width: 350px; background: linear-gradient(45deg, var(--neon-pink), #ff4a4a); 
            color: var(--white); font-weight: 800; font-size: 1.2rem; padding: 18px; 
            border-radius: 8px; border: none; cursor: pointer; transition: 0.2s; 
            box-shadow: 0 5px 15px rgba(255, 0, 127, 0.4);
        }
        .play-btn:active { transform: scale(0.95); box-shadow: 0 2px 5px rgba(255, 0, 127, 0.4); }

        /* GAME SCREEN UI */
        #word-display { 
            font-size: 2.5rem; font-weight: 900; height: 3.5rem; color: var(--white); 
            letter-spacing: 2px; display: flex; align-items: center; justify-content: center;
            text-shadow: -2px 0 var(--neon-cyan), 2px 0 var(--neon-pink);
            margin-bottom: 2vh;
        }
        
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; max-width: 380px; }
        .tile { 
            aspect-ratio: 1; background: var(--panel-bg); border: 2px solid rgba(0, 240, 255, 0.3); 
            display: flex; align-items: center; justify-content: center; 
            font-size: 2rem; font-weight: 800; border-radius: 12px; transition: 0.1s; 
            color: var(--white); box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .tile:active { 
            background: var(--neon-cyan); color: var(--bg-deep); transform: scale(0.85); 
            border-color: var(--neon-cyan); box-shadow: 0 0 15px var(--neon-cyan);
        }

        .game-actions { display: flex; gap: 15px; width: 100%; max-width: 380px; margin-top: 3vh; }
        .btn { flex: 1; padding: 18px; border-radius: 8px; border: none; font-weight: 800; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
        .btn:active { transform: scale(0.95); }
        .btn-clear { background: transparent; color: var(--text-light); border: 2px solid var(--neon-cyan); }
        .btn-submit { background: var(--neon-cyan); color: var(--bg-deep); box-shadow: 0 4px 15px rgba(0, 240, 255, 0.4); }

        .found-words { margin-top: 3vh; font-size: 0.9rem; color: var(--text-light); width: 100%; text-align: center; height: 60px; overflow-y: auto; line-height: 1.5; padding: 0 10px; }
        .found-label { color: var(--neon-pink); font-weight: bold; margin-right: 5px; }

        /* ANIMATIONS */
        @keyframes spider-pop { 
            0% { transform: scale(1); } 
            50% { transform: scale(1.2) rotate(-2deg); text-shadow: -4px 0 var(--neon-cyan), 4px 0 var(--neon-pink); } 
            100% { transform: scale(1); } 
        }
        .spider-pop { animation: spider-pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        @keyframes glitch { 
            0% { transform: translate(0); }
            20% { transform: translate(-4px, 2px); color: var(--neon-pink); }
            40% { transform: translate(4px, -2px); color: var(--neon-cyan); }
            60% { transform: translate(-4px, -2px); }
            80% { transform: translate(4px, 2px); color: var(--neon-pink); }
            100% { transform: translate(0); }
        }
        .glitch { animation: glitch 0.3s ease-in-out; }
    </style>
</head>
<body>

    <div id="home-screen" class="screen active">
        <div class="top-bar" style="justify-content: flex-end; border: none;">
            <button class="icon-btn music-off" id="bgm-toggle-home" onclick="toggleBGM()">🔈</button>
        </div>

        <div class="title-container">
            <div class="title">JIN</div>
            <div class="subtitle">SCRAMBLE</div>
        </div>

        <div class="leaderboard" id="leaderboard-ui">
            <div class="leaderboard-title">TOP PLAYERS</div>
            </div>

        <input type="text" id="player-name" placeholder="Enter your name" maxlength="12">
        <button class="play-btn" onclick="startNewGame()">PLAY GAME</button>
    </div>

    <div id="game-screen" class="screen">
        <div class="top-bar">
            <div class="stat-box">Score: <span id="score-val" class="stat-val">0</span></div>
            <div style="display: flex; gap: 10px;">
                <button class="icon-btn music-off" id="bgm-toggle-game" onclick="toggleBGM()">🔈</button>
                <button class="icon-btn" onclick="exitToHome()">✖</button>
            </div>
        </div>

        <div id="word-display"></div>

        <div class="grid" id="letter-grid"></div>

        <div class="game-actions">
            <button class="btn btn-clear" onclick="clearWord()">CLEAR</button>
            <button class="btn btn-submit" onclick="submitWord()">SUBMIT</button>
        </div>

        <div class="found-words" id="found-list"><span class="found-label">FOUND:</span> </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#0B0C10'); 
        tg.setBackgroundColor('#0B0C10');

        // AUDIO ENGINE
        const sfx = {
            tap: new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3'),
            win: new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3'), // More energetic win sound
            fail: new Audio('https://assets.mixkit.co/active_storage/sfx/2572/2572-preview.mp3')
        };
        sfx.tap.volume = 0.4; sfx.win.volume = 0.6; sfx.fail.volume = 0.5;

        // Background Music (Tense, driving beat)
        const bgMusic = new Audio('https://assets.mixkit.co/active_storage/music/226/226-preview.mp3');
        bgMusic.loop = true;
        bgMusic.volume = 0.3;
        let isMusicPlaying = false;

        function toggleBGM() {
            const btnHome = document.getElementById('bgm-toggle-home');
            const btnGame = document.getElementById('bgm-toggle-game');
            
            if (isMusicPlaying) {
                bgMusic.pause();
                isMusicPlaying = false;
                btnHome.innerText = "🔈"; btnGame.innerText = "🔈";
                btnHome.classList.add('music-off'); btnGame.classList.add('music-off');
            } else {
                bgMusic.play().catch(()=>{});
                isMusicPlaying = true;
                btnHome.innerText = "🔊"; btnGame.innerText = "🔊";
                btnHome.classList.remove('music-off'); btnGame.classList.remove('music-off');
            }
        }

        // STATE MANAGEMENT
        let currentWord = "";
        let sessionScore = 0;
        let sessionWords = [];
        let playerName = localStorage.getItem('jin_player_name') || "";
        let leaderboardData = JSON.parse(localStorage.getItem('jin_leaderboard')) || [];

        // 1. HOME LOGIC
        function initHome() {
            document.getElementById('player-name').value = playerName;
            renderLeaderboard();
        }

        function renderLeaderboard() {
            const container = document.getElementById('leaderboard-ui');
            const items = container.querySelectorAll('.rank-item');
            items.forEach(i => i.remove());

            const sorted = leaderboardData.sort((a,b) => b.score - a.score).slice(0, 5);
            
            if (sorted.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'rank-item';
                empty.innerHTML = `<span class="rank-name" style="color:rgba(255,255,255,0.4)">No scores yet...</span>`;
                container.appendChild(empty);
            }

            sorted.forEach((entry, idx) => {
                const div = document.createElement('div');
                div.className = 'rank-item';
                div.innerHTML = `
                    <span class="rank-name">${idx + 1}. ${entry.name}</span>
                    <span class="rank-score">${entry.score}</span>
                `;
                container.appendChild(div);
            });
        }

        function startNewGame() {
            const input = document.getElementById('player-name').value.trim();
            if (!input) {
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                return alert("Please enter your name!");
            }
            
            playerName = input;
            localStorage.setItem('jin_player_name', playerName);
            
            sessionScore = 0;
            sessionWords = [];
            document.getElementById('score-val').innerText = "0";
            updateFoundWords();
            
            switchScreen('game-screen');
            initGrid();
        }

        // 2. GAME LOGIC
        const letters = "EEEEAEEEEIIIIOOOOOUUUUDDDLLLLNNNNRRRRSTTTTBCMPFHGKVWYJZXQ";
        
        function initGrid() {
            const grid = document.getElementById('letter-grid');
            grid.innerHTML = '';
            for(let i=0; i<16; i++) {
                const char = letters.charAt(Math.floor(Math.random() * letters.length));
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerText = char;
                tile.onpointerdown = () => {
                    sfx.tap.currentTime = 0; sfx.tap.play().catch(()=>{});
                    if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                    currentWord += char;
                    document.getElementById('word-display').innerText = currentWord;
                };
                grid.appendChild(tile);
            }
        }

        async function submitWord() {
            if (currentWord.length < 3) return;
            const display = document.getElementById('word-display');

            if (sessionWords.includes(currentWord)) {
                display.innerText = "ALREADY FOUND";
                display.classList.add('glitch');
                sfx.fail.play().catch(()=>{});
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                setTimeout(clearWord, 600);
                return;
            }

            try {
                const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${currentWord.toLowerCase()}`);
                if (res.ok) {
                    let points = currentWord.length <= 3 ? 10 : currentWord.length === 4 ? 30 : currentWord.length === 5 ? 60 : 120;
                    sessionScore += points;
                    sessionWords.push(currentWord);
                    
                    document.getElementById('score-val').innerText = sessionScore;
                    updateFoundWords();
                    
                    display.classList.add('spider-pop');
                    sfx.win.currentTime = 0; sfx.win.play().catch(()=>{});
                    if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    setTimeout(clearWord, 500);
                } else {
                    display.classList.add('glitch');
                    sfx.fail.play().catch(()=>{});
                    if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                    setTimeout(clearWord, 500);
                }
            } catch (e) { clearWord(); }
        }

        function clearWord() {
            currentWord = "";
            const display = document.getElementById('word-display');
            display.innerText = "";
            display.classList.remove('glitch', 'spider-pop');
        }

        function updateFoundWords() {
            document.getElementById('found-list').innerHTML = `<span class="found-label">FOUND:</span> ` + sessionWords.join(" • ");
        }

        // 3. UTILITIES
        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function exitToHome() {
            if (sessionScore > 0) {
                leaderboardData.push({ name: playerName, score: sessionScore });
                localStorage.setItem('jin_leaderboard', JSON.stringify(leaderboardData));
            }
            initHome();
            switchScreen('home-screen');
        }

        initHome();
    </script>
</body>
</html>
