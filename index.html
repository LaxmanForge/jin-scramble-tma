<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jin Scramble</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* MILES MORALES SPIDER-VERSE PALETTE */
        :root { 
            --bg-deep: #050505; 
            --panel-bg: #121212; 
            --spider-red: #E23636; 
            --text-light: #F4F4F4;
            --border-dark: #2A2A2A;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

        body { 
            font-family: "Impact", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-deep); 
            background-image: radial-gradient(#222 1px, transparent 1px);
            background-size: 8px 8px;
            color: var(--text-light); 
            margin: 0; 
            height: 100dvh; 
            display: flex; 
            flex-direction: column;
            overflow: hidden;
        }

        /* Screen Management */
        .screen { display: none; flex-direction: column; align-items: center; width: 100%; height: 100%; padding: 20px; }
        .active { display: flex; }

        /* HEADER & CONTROLS */
        .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; margin-bottom: 20px; border-bottom: 3px solid var(--spider-red); }
        .stat-box { font-size: 0.9rem; letter-spacing: 1px; color: var(--text-light); text-transform: uppercase; font-family: sans-serif; font-weight: bold; }
        .stat-val { color: var(--spider-red); font-size: 1.2rem; }
        
        .icon-btn { background: var(--panel-bg); border: 2px solid var(--border-dark); color: var(--text-light); padding: 8px 12px; border-radius: 6px; font-size: 1.2rem; cursor: pointer; transition: 0.1s; }
        .icon-btn:active { transform: scale(0.9); background: var(--spider-red); border-color: var(--spider-red); }
        .music-off { opacity: 0.5; }

        /* HOME SCREEN UI */
        .title-container { margin-top: 5vh; margin-bottom: 4vh; text-align: center; transform: rotate(-2deg); }
        .title { 
            font-size: 4rem; font-weight: 900; font-style: italic; color: var(--text-light); 
            letter-spacing: -2px; margin: 0; line-height: 0.9;
            text-transform: uppercase;
            text-shadow: 4px 4px 0px var(--spider-red);
        }

        .leaderboard { 
            width: 100%; max-width: 350px; background: var(--panel-bg); 
            padding: 20px; margin-bottom: 30px; 
            border: 3px solid var(--border-dark);
            border-radius: 4px;
        }
        .leaderboard-title { font-size: 1rem; font-weight: bold; font-family: sans-serif; letter-spacing: 2px; color: var(--spider-red); margin-bottom: 15px; border-bottom: 2px solid var(--border-dark); padding-bottom: 10px; }
        .rank-item { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 1.1rem; font-family: sans-serif; font-weight: 600; }
        .rank-name { color: var(--text-light); }
        .rank-score { color: var(--spider-red); }

        input { 
            width: 100%; max-width: 350px; background: var(--bg-deep); border: 3px solid var(--border-dark); 
            color: var(--text-light); padding: 15px; font-size: 1.2rem; 
            text-align: center; margin-bottom: 15px; outline: none; font-weight: bold; font-family: sans-serif;
            border-radius: 4px;
        }
        input:focus { border-color: var(--spider-red); }

        .play-btn { 
            width: 100%; max-width: 350px; background: var(--spider-red); 
            color: var(--text-light); font-weight: 800; font-size: 1.3rem; padding: 18px; 
            border: 3px solid #b32424; cursor: pointer; transition: 0.1s; 
            text-transform: uppercase; font-style: italic; border-radius: 4px;
        }
        .play-btn:active { transform: scale(0.95) rotate(-1deg); }

        /* GAME SCREEN UI */
        #word-display { 
            font-size: 2.8rem; font-weight: 900; height: 3.5rem; color: var(--text-light); 
            letter-spacing: 2px; display: flex; align-items: center; justify-content: center;
            text-transform: uppercase; margin-bottom: 2vh;
        }
        
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; max-width: 380px; }
        .tile { 
            aspect-ratio: 1; background: var(--panel-bg); border: 3px solid var(--border-dark); 
            display: flex; align-items: center; justify-content: center; 
            font-size: 2.2rem; font-weight: 800; font-family: sans-serif; transition: 0.1s; 
            color: var(--text-light); border-radius: 4px;
        }
        .tile:active { 
            background: var(--spider-red); color: var(--text-light); transform: scale(0.9); 
            border-color: #b32424;
        }
        /* New style to show which tiles have been tapped */
        .tile.pressed {
            opacity: 0.4;
            border-color: var(--spider-red);
        }

        .game-actions { display: flex; gap: 12px; width: 100%; max-width: 380px; margin-top: 3vh; }
        .btn { flex: 1; padding: 18px; border: 3px solid var(--border-dark); font-weight: 800; cursor: pointer; font-size: 1.2rem; font-family: sans-serif; transition: 0.1s; border-radius: 4px; }
        .btn:active { transform: scale(0.95); }
        .btn-clear { background: var(--bg-deep); color: var(--text-light); }
        .btn-submit { background: var(--spider-red); color: var(--text-light); border-color: #b32424; }

        .found-words { margin-top: 3vh; font-size: 0.9rem; font-family: sans-serif; color: #888; width: 100%; text-align: center; height: 60px; overflow-y: auto; line-height: 1.5; padding: 0 10px; }
        .found-label { color: var(--spider-red); font-weight: bold; margin-right: 5px; }

        /* ANIMATIONS */
        @keyframes comic-pop { 
            0% { transform: scale(1); } 
            50% { transform: scale(1.15) rotate(-3deg); color: var(--spider-red); } 
            100% { transform: scale(1); } 
        }
        .comic-pop { animation: comic-pop 0.3s ease-out; }
        
        @keyframes shake { 0%, 100% { transform: translateX(0); color: #555; } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
        .shake { animation: shake 0.3s ease-in-out; }
    </style>
</head>
<body>

    <div id="home-screen" class="screen active">
        <div class="top-bar" style="justify-content: flex-end; border: none;">
            <button class="icon-btn music-off" id="bgm-toggle-home" onclick="toggleBGM()">🔈</button>
        </div>

        <div class="title-container">
            <div class="title">JIN<br>SCRAMBLE</div>
        </div>

        <div class="leaderboard" id="leaderboard-ui">
            <div class="leaderboard-title">TOP OPERATORS</div>
        </div>

        <input type="text" id="player-name" placeholder="ENTER NAME" maxlength="12">
        <button class="play-btn" onclick="startNewGame()">START RUN</button>
    </div>

    <div id="game-screen" class="screen">
        <div class="top-bar">
            <div class="stat-box">EXP: <span id="score-val" class="stat-val">0</span></div>
            <div style="display: flex; gap: 10px;">
                <button class="icon-btn music-off" id="bgm-toggle-game" onclick="toggleBGM()">🔈</button>
                <button class="icon-btn" onclick="exitToHome()">✖</button>
            </div>
        </div>

        <div id="word-display"></div>

        <div class="grid" id="letter-grid"></div>

        <div class="game-actions">
            <button class="btn btn-clear" onclick="clearWord()">CLEAR</button>
            <button class="btn btn-submit" onclick="submitWord()">SUBMIT</button>
        </div>

        <div class="found-words" id="found-list"><span class="found-label">MEMORY:</span> </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#050505'); 
        tg.setBackgroundColor('#050505');

        // AUDIO ENGINE
        const sfx = {
            tap: new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3'),
            win: new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3'), 
            fail: new Audio('https://assets.mixkit.co/active_storage/sfx/2572/2572-preview.mp3')
        };
        sfx.tap.volume = 0.4; sfx.win.volume = 0.6; sfx.fail.volume = 0.5;

        // BGM ENGINE: Directly links to Kevin MacLeod's "Sneaky Snitch" (Mystery/Detective Vibe)
        const bgMusic = new Audio('https://incompetech.com/music/royalty-free/mp3-royaltyfree/Sneaky%20Snitch.mp3');
        bgMusic.loop = true;
        bgMusic.volume = 0.4;
        let isMusicPlaying = false;

        function toggleBGM() {
            const btnHome = document.getElementById('bgm-toggle-home');
            const btnGame = document.getElementById('bgm-toggle-game');
            
            if (isMusicPlaying) {
                bgMusic.pause();
                isMusicPlaying = false;
                btnHome.innerText = "🔈"; btnGame.innerText = "🔈";
                btnHome.classList.add('music-off'); btnGame.classList.add('music-off');
            } else {
                bgMusic.play().catch(()=>{ console.log("Audio play blocked by browser."); });
                isMusicPlaying = true;
                btnHome.innerText = "🔊"; btnGame.innerText = "🔊";
                btnHome.classList.remove('music-off'); btnGame.classList.remove('music-off');
            }
        }

        let currentWord = "";
        let sessionScore = 0;
        let sessionWords = [];
        let playerName = localStorage.getItem('jin_player_name') || "";
        let leaderboardData = JSON.parse(localStorage.getItem('jin_leaderboard')) || [];

        function initHome() {
            document.getElementById('player-name').value = playerName;
            renderLeaderboard();
        }

        function renderLeaderboard() {
            const container = document.getElementById('leaderboard-ui');
            const items = container.querySelectorAll('.rank-item');
            items.forEach(i => i.remove());

            const sorted = leaderboardData.sort((a,b) => b.score - a.score).slice(0, 5);
            
            if (sorted.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'rank-item';
                empty.innerHTML = `<span class="rank-name" style="color:#555">NO DATA...</span>`;
                container.appendChild(empty);
            }

            sorted.forEach((entry, idx) => {
                const div = document.createElement('div');
                div.className = 'rank-item';
                div.innerHTML = `
                    <span class="rank-name">${idx + 1}. ${entry.name}</span>
                    <span class="rank-score">${entry.score}</span>
                `;
                container.appendChild(div);
            });
        }

        function startNewGame() {
            const input = document.getElementById('player-name').value.trim();
            if (!input) {
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                return alert("Please enter your name.");
            }
            playerName = input;
            localStorage.setItem('jin_player_name', playerName);
            sessionScore = 0;
            sessionWords = [];
            document.getElementById('score-val').innerText = "0";
            updateFoundWords();
            switchScreen('game-screen');
            initGrid();
        }

        // The Official "Boggle" Dice Configuration (Guarantees good word combinations)
        const diceConfig = [
            "AAEEGN", "ABBJOO", "ACHOPS", "AFFKPS",
            "AOOTTW", "CIMOTU", "DEILRX", "DELRVY",
            "DISTTY", "EEGHNW", "EEINSU", "EHRTVW",
            "EIOSST", "ELRTTY", "HIMNQU", "HLNNRZ"
        ];

        function initGrid() {
            const grid = document.getElementById('letter-grid');
            grid.innerHTML = '';
            
            // 1. Copy the dice array
            let availableDice = [...diceConfig];
            
            // 2. Fisher-Yates Shuffle the dice
            for (let i = availableDice.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [availableDice[i], availableDice[j]] = [availableDice[j], availableDice[i]];
            }

            // 3. Roll each die and create the tile
            availableDice.forEach(die => {
                const char = die.charAt(Math.floor(Math.random() * die.length));
                
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerText = char === 'Q' ? 'Qu' : char; 
                
                tile.onpointerdown = () => {
                    sfx.tap.currentTime = 0; sfx.tap.play().catch(()=>{});
                    if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                    
                    // Prevent adding if tile was already pressed this round
                    if(tile.classList.contains('pressed')) return; 
                    
                    tile.classList.add('pressed');
                    currentWord += char;
                    document.getElementById('word-display').innerText = currentWord;
                };
                grid.appendChild(tile);
            });
        }

        async function submitWord() {
            if (currentWord.length < 3) return;
            const display = document.getElementById('word-display');

            if (sessionWords.includes(currentWord)) {
                display.innerText = "DUPLICATE";
                display.classList.add('shake');
                sfx.fail.play().catch(()=>{});
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                setTimeout(clearWord, 600);
                return;
            }

            try {
                const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${currentWord.toLowerCase()}`);
                if (res.ok) {
                    let points = currentWord.length <= 3 ? 10 : currentWord.length === 4 ? 30 : currentWord.length === 5 ? 60 : 120;
                    sessionScore += points;
                    sessionWords.push(currentWord);
                    document.getElementById('score-val').innerText = sessionScore;
                    updateFoundWords();
                    
                    display.classList.add('comic-pop');
                    sfx.win.currentTime = 0; sfx.win.play().catch(()=>{});
                    if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    setTimeout(clearWord, 400);
                } else {
                    display.classList.add('shake');
                    sfx.fail.play().catch(()=>{});
                    if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                    setTimeout(clearWord, 400);
                }
            } catch (e) { clearWord(); }
        }

        function clearWord() {
            currentWord = "";
            const display = document.getElementById('word-display');
            display.innerText = "";
            display.classList.remove('shake', 'comic-pop');
            
            // Re-activate all tiles
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('pressed'));
        }

        function updateFoundWords() {
            document.getElementById('found-list').innerHTML = `<span class="found-label">MEMORY:</span> ` + sessionWords.join(" • ");
        }

        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function exitToHome() {
            if (sessionScore > 0) {
                leaderboardData.push({ name: playerName, score: sessionScore });
                localStorage.setItem('jin_leaderboard', JSON.stringify(leaderboardData));
            }
            initHome();
            switchScreen('home-screen');
        }

        initHome();
    </script>
</body>
</html>
