<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jin Scramble</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>

    <style>
        /* MILES MORALES SPIDER-VERSE PALETTE */
        :root { 
            --bg-deep: #050505; --panel-bg: #121212; --spider-red: #E23636; 
            --text-light: #F4F4F4; --border-dark: #2A2A2A; --tg-blue: #2481cc;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

        body { 
            font-family: "Impact", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-deep); background-image: radial-gradient(#222 1px, transparent 1px);
            background-size: 8px 8px; color: var(--text-light); margin: 0; 
            height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
        }

        .screen { display: none; flex-direction: column; align-items: center; width: 100%; height: 100%; padding: 20px; }
        .active { display: flex; }

        .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; margin-bottom: 20px; border-bottom: 3px solid var(--spider-red); }
        .stat-box { font-size: 0.9rem; letter-spacing: 1px; color: var(--text-light); text-transform: uppercase; font-family: sans-serif; font-weight: bold; }
        .stat-val { color: var(--spider-red); font-size: 1.4rem; }
        
        .icon-btn { background: var(--panel-bg); border: 2px solid var(--border-dark); color: var(--text-light); padding: 8px 12px; border-radius: 6px; font-size: 1.2rem; cursor: pointer; transition: 0.1s; }
        .icon-btn:active { transform: scale(0.9); background: var(--spider-red); border-color: var(--spider-red); }
        .music-off { opacity: 0.5; color: #555; }

        .title-container { margin-top: 5vh; margin-bottom: 4vh; text-align: center; transform: rotate(-2deg); }
        .title { font-size: 4rem; font-weight: 900; font-style: italic; color: var(--text-light); letter-spacing: -2px; margin: 0; line-height: 0.9; text-transform: uppercase; text-shadow: 4px 4px 0px var(--spider-red); }

        .leaderboard { width: 100%; max-width: 350px; background: var(--panel-bg); padding: 20px; margin-bottom: 30px; border: 3px solid var(--border-dark); border-radius: 4px; }
        .leaderboard-title { font-size: 1rem; font-weight: bold; font-family: sans-serif; letter-spacing: 2px; color: var(--spider-red); margin-bottom: 15px; border-bottom: 2px solid var(--border-dark); padding-bottom: 10px; }
        .rank-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 1.1rem; font-family: sans-serif; font-weight: 600; padding: 5px; }
        .rank-name { color: var(--text-light); } .rank-score { color: var(--spider-red); }

        .rank-1 { background: linear-gradient(90deg, #1a1a1a, #2a0808); border-left: 4px solid var(--spider-red); border-radius: 4px; padding: 12px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(226, 54, 54, 0.15); font-weight: 900; letter-spacing: 1px; }
        .rank-1 .rank-name { color: var(--text-light); text-shadow: 0 0 5px rgba(255,255,255,0.2); }
        .rank-1 .rank-score { color: var(--spider-red); text-shadow: 0 0 8px rgba(226, 54, 54, 0.5); }

        /* Telegram Auth UI */
        #tg-auth-badge { display: none; width: 100%; max-width: 350px; background: rgba(36, 129, 204, 0.1); border: 2px solid var(--tg-blue); color: var(--text-light); padding: 15px; text-align: center; font-family: sans-serif; font-weight: bold; border-radius: 4px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        #tg-auth-badge span { color: var(--tg-blue); }

        input { width: 100%; max-width: 350px; background: var(--bg-deep); border: 3px solid var(--border-dark); color: var(--text-light); padding: 15px; font-size: 1.2rem; text-align: center; margin-bottom: 15px; outline: none; font-weight: bold; font-family: sans-serif; border-radius: 4px; text-transform: uppercase;}
        input:focus { border-color: var(--spider-red); }

        .play-btn { width: 100%; max-width: 350px; background: var(--spider-red); color: var(--text-light); font-weight: 800; font-size: 1.3rem; padding: 18px; border: 3px solid #b32424; cursor: pointer; transition: 0.1s; text-transform: uppercase; font-style: italic; border-radius: 4px; }
        .play-btn:active { transform: scale(0.95) rotate(-1deg); }

        #word-display { font-size: 3rem; font-weight: 900; height: 4rem; color: var(--text-light); letter-spacing: 2px; display: flex; align-items: center; justify-content: center; text-transform: uppercase; margin-bottom: 2vh; transition: 0.2s; }
        
        .grid-container { padding: 10px; border-radius: 8px; transition: 0.3s; border: 2px solid transparent; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 320px; }
        .tile { aspect-ratio: 1; background: var(--panel-bg); border: 3px solid var(--border-dark); display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: 800; font-family: sans-serif; transition: 0.1s; color: var(--text-light); border-radius: 8px; box-shadow: 0 4px 0 var(--border-dark); }
        .tile:active, .tile.tapped { transform: translateY(4px) scale(0.95); background: var(--spider-red); border-color: #b32424; color: white; box-shadow: 0 0px 0 var(--border-dark); }

        .game-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; width: 100%; max-width: 360px; margin-top: 4vh; }
        .btn { padding: 15px 5px; border: 3px solid var(--border-dark); font-weight: 800; cursor: pointer; font-size: 1.1rem; font-family: sans-serif; transition: 0.1s; border-radius: 4px; text-transform: uppercase; }
        .btn:active { transform: scale(0.95); }
        .btn-clear { background: var(--bg-deep); color: var(--text-light); }
        .btn-shuffle { background: #E28743; color: var(--bg-deep); border-color: #c97131; }
        .btn-submit { background: var(--spider-red); color: var(--text-light); border-color: #b32424; }

        .found-words { margin-top: 3vh; font-size: 0.9rem; font-family: sans-serif; color: #888; width: 100%; text-align: center; height: 60px; overflow-y: auto; line-height: 1.5; padding: 0 10px; }
        .found-label { color: var(--spider-red); font-weight: bold; margin-right: 5px; }

        @keyframes spider-glow { 0% { box-shadow: 0 0 0px var(--spider-red); border-color: transparent; } 50% { box-shadow: 0 0 40px var(--spider-red), inset 0 0 20px var(--spider-red); border-color: var(--spider-red); background: rgba(226, 54, 54, 0.15); } 100% { box-shadow: 0 0 0px var(--spider-red); border-color: transparent; } }
        .grid-success { animation: spider-glow 0.6s ease-out; }
        .word-success { color: var(--text-light) !important; text-shadow: 0 0 15px rgba(255,255,255,0.8), 3px 3px 0 var(--spider-red) !important; transform: scale(1.2) rotate(-3deg); }
        @keyframes shake { 0%, 100% { transform: translateX(0); color: #555; } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
        .shake { animation: shake 0.3s ease-in-out; }
    </style>
</head>
<body>

    <div id="home-screen" class="screen active">
        <div class="top-bar" style="justify-content: flex-end; border: none;">
            <button class="icon-btn" id="bgm-toggle-home" onclick="toggleBGM()">🔊</button>
        </div>
        <div class="title-container"><div class="title">JIN<br>SCRAMBLE</div></div>
        
        <div class="leaderboard" id="leaderboard-ui">
            <div class="leaderboard-title">GLOBAL INTEL</div>
            <div id="leaderboard-content"></div>
        </div>

        <div id="tg-auth-badge">AGENT: <span id="tg-user-name"></span></div>
        <input type="text" id="player-name" placeholder="ENTER CODENAME" maxlength="12">
        
        <button class="play-btn" onclick="startNewGame()">INITIALIZE</button>
    </div>

    <div id="game-screen" class="screen">
        <div class="top-bar">
            <div class="stat-box">EXP: <span id="score-val" class="stat-val">0</span></div>
            <div style="display: flex; gap: 10px;">
                <button class="icon-btn" id="bgm-toggle-game" onclick="toggleBGM()">🔊</button>
                <button class="icon-btn" onclick="exitToHome()">✖</button>
            </div>
        </div>
        <div id="word-display"></div>
        <div class="grid-container" id="grid-wrapper">
            <div class="grid" id="letter-grid"></div>
        </div>
        <div class="game-actions">
            <button class="btn btn-clear" onclick="clearWord()">CLEAR</button>
            <button class="btn btn-shuffle" id="shuffle-btn" onclick="shuffleBoard()">SHUFFLE (-20)</button>
            <button class="btn btn-submit" id="submit-btn" onclick="submitWord()">SUBMIT</button>
        </div>
        <div class="found-words" id="found-list"><span class="found-label">MEMORY:</span> </div>
    </div>

    <script>
        // --- 1. FIREBASE SETUP ---
         const firebaseConfig = {

            apiKey: "AIzaSyBcjuRun9IRDTBoA--BZoEEPT27vZbThw0",

           authDomain: "jin-scrable.firebaseapp.com",

           projectId: "jin-scrable",

           storageBucket: "jin-scrable.firebasestorage.app",

           messagingSenderId: "537097102091",

           appId: "1:537097102091:web:f8e039030d9ae9ca36f80e",

           measurementId: "G-GK9QRKC12P"

};
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- 2. TELEGRAM AUTO-AUTH ENGINE ---
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#050505'); tg.setBackgroundColor('#050505');
        tg.ready();

        let playerName = ""; // Friendly name (e.g. "melon")
        let playerId = "";   // Unique Aadhar card (e.g. "12345678")
        let isTgAuthenticated = false;

        function checkTelegramUser() {
            const tgUser = tg.initDataUnsafe?.user;
            if (tgUser) {
                playerName = tgUser.first_name; // Only grab their real first name!
                playerId = tgUser.id.toString(); // Secretly use their ID for the database
                isTgAuthenticated = true;
                
                document.getElementById('player-name').style.display = 'none';
                const badge = document.getElementById('tg-auth-badge');
                badge.style.display = 'block';
                document.getElementById('tg-user-name').innerText = playerName;
            } else {
                playerName = localStorage.getItem('jin_player_name') || "";
                playerId = playerName; // Fallback
                document.getElementById('player-name').value = playerName;
            }
        }

        // --- 3. RELAXING AUDIO ENGINE ---
        const sfx = {
            // soft, relaxing "pop" sound
            tap: new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3'),
            win: new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3'), 
            fail: new Audio('https://assets.mixkit.co/active_storage/sfx/2572/2572-preview.mp3')
        };
        sfx.tap.volume = 0.3; // Low volume for chill vibes
        sfx.win.volume = 0.5; 
        sfx.fail.volume = 0.3;

        const bgMusic = new Audio('bgm.mp3');
        bgMusic.loop = true; bgMusic.volume = 0.4;
        let isMusicPlaying = true; let hasInteracted = false; 

        document.body.addEventListener('pointerdown', () => {
            if (!hasInteracted && isMusicPlaying) {
                bgMusic.play().catch(e => console.log("Audio blocked", e));
                hasInteracted = true;
            }
        }, { once: true });

        function toggleBGM() {
            const btnHome = document.getElementById('bgm-toggle-home');
            const btnGame = document.getElementById('bgm-toggle-game');
            if (isMusicPlaying) {
                bgMusic.pause(); isMusicPlaying = false;
                btnHome.innerText = "🔈"; btnGame.innerText = "🔈";
                btnHome.classList.add('music-off'); btnGame.classList.add('music-off');
            } else {
                bgMusic.play().catch(()=>{}); isMusicPlaying = true; hasInteracted = true;
                btnHome.innerText = "🔊"; btnGame.innerText = "🔊";
                btnHome.classList.remove('music-off'); btnGame.classList.remove('music-off');
            }
        }

        // --- 4. STATE MANAGEMENT ---
        let currentWord = ""; let sessionScore = 0; let sessionWords = [];
        let isSubmitting = false; 

        async function initHome() {
            checkTelegramUser();
            await fetchLeaderboard();
        }

        async function fetchLeaderboard() {
            const container = document.getElementById('leaderboard-content');
            container.innerHTML = `<div class="rank-item"><span class="rank-name" style="color:#888">SYNCING SATELLITE DATA...</span></div>`;
            
            try {
                const snapshot = await db.collection('scores').orderBy('score', 'desc').limit(5).get();
                container.innerHTML = '';
                
                if(snapshot.empty) {
                    container.innerHTML = `<div class="rank-item"><span class="rank-name" style="color:#555">NO DATA...</span></div>`;
                    return;
                }

                let idx = 0;
                snapshot.forEach(doc => {
                    let entry = doc.data();
                    let rankClass = idx === 0 ? "rank-1" : "";
                    let tag = `${idx + 1}.`;
                    
                    // Display their friendly name, fallback to old IDs if name doesn't exist yet
                    let displayName = entry.name ? entry.name : doc.id; 
                    
                    container.innerHTML += `
                    <div class="rank-item ${rankClass}">
                        <span class="rank-name">${tag} ${displayName}</span>
                        <span class="rank-score">${entry.score}</span>
                    </div>`;
                    idx++;
                });
            } catch (e) {
                console.error("Firebase Error:", e);
                container.innerHTML = `<div class="rank-item"><span class="rank-name" style="color:#555">OFFLINE MODE</span></div>`;
            }
        }

        async function pushScoreToCloud() {
            if (sessionScore === 0 || !playerId) return;
            try {
                const docRef = db.collection('scores').doc(playerId); // Uses unique ID
                const docSnap = await docRef.get();
                if (!docSnap.exists || sessionScore > docSnap.data().score) {
                    // Saves BOTH score and friendly name!
                    await docRef.set({ score: sessionScore, name: playerName }); 
                }
            } catch (e) { console.error("Cloud Save Failed", e); }
        }

        function startNewGame() {
            if (!isTgAuthenticated) {
                const input = document.getElementById('player-name').value.trim().toUpperCase();
                if (!input) return alert("Please enter your codename.");
                playerName = input; 
                localStorage.setItem('jin_player_name', playerName);
            }
            sessionScore = 0; sessionWords = [];
            document.getElementById('score-val').innerText = "0";
            updateFoundWords(); switchScreen('game-screen'); initGrid();
        }

        // --- 5. GAME MECHANICS ---
        const vowels = "AEIOUY"; const consonants = "BCDFGHJKLMNPQRSTVWXZ";
        function getUniqueLetters(pool, count) {
            return pool.split('').sort(() => 0.5 - Math.random()).slice(0, count);
        }

        function initGrid() {
            const grid = document.getElementById('letter-grid');
            grid.innerHTML = ''; clearWord();
            let boardLetters = [...getUniqueLetters(vowels, 3), ...getUniqueLetters(consonants, 6)].sort(() => Math.random() - 0.5);

            boardLetters.forEach(char => {
                const tile = document.createElement('div');
                tile.className = 'tile'; tile.innerText = char; 
                tile.onpointerdown = () => {
                    sfx.tap.currentTime = 0; sfx.tap.play().catch(()=>{});
                    if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                    tile.classList.add('tapped'); setTimeout(() => tile.classList.remove('tapped'), 150);
                    currentWord += char; document.getElementById('word-display').innerText = currentWord;
                };
                grid.appendChild(tile);
            });
        }

        function shuffleBoard() {
            if (sessionScore >= 20) {
                sessionScore -= 20; document.getElementById('score-val').innerText = sessionScore;
                sfx.tap.play().catch(()=>{}); pushScoreToCloud(); initGrid();
            } else {
                sfx.fail.play().catch(()=>{});
                const btn = document.getElementById('shuffle-btn');
                btn.classList.add('shake'); setTimeout(() => btn.classList.remove('shake'), 500);
            }
        }

        async function submitWord() {
            if (currentWord.length < 3 || isSubmitting) return;
            isSubmitting = true; 
            const display = document.getElementById('word-display');
            const wrapper = document.getElementById('grid-wrapper');
            
            if (sessionWords.includes(currentWord)) {
                display.innerText = "DUPLICATE"; display.classList.add('shake');
                sfx.fail.play().catch(()=>{}); setTimeout(() => { clearWord(); isSubmitting = false; }, 600); 
                return;
            }
            
            try {
                const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${currentWord.toLowerCase()}`);
                if (res.ok) {
                    sessionScore += currentWord.length <= 3 ? 10 : currentWord.length === 4 ? 30 : currentWord.length === 5 ? 60 : 120;
                    sessionWords.push(currentWord); 
                    document.getElementById('score-val').innerText = sessionScore;
                    updateFoundWords(); 
                    pushScoreToCloud(); 

                    display.classList.add('word-success'); wrapper.classList.add('grid-success');
                    sfx.win.currentTime = 0; sfx.win.play().catch(()=>{});
                    if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    
                    setTimeout(() => { display.classList.remove('word-success'); wrapper.classList.remove('grid-success'); clearWord(); isSubmitting = false; }, 700);
                } else {
                    display.classList.add('shake'); sfx.fail.play().catch(()=>{}); 
                    if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                    setTimeout(() => { clearWord(); isSubmitting = false; }, 500);
                }
            } catch (e) { clearWord(); isSubmitting = false; }
        }

        function clearWord() { currentWord = ""; document.getElementById('word-display').innerText = ""; document.getElementById('word-display').classList.remove('shake', 'word-success'); }
        function updateFoundWords() { document.getElementById('found-list').innerHTML = `<span class="found-label">MEMORY:</span> ` + sessionWords.join(" • "); }

        function switchScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
        
        async function exitToHome() {
            await pushScoreToCloud();
            initHome(); switchScreen('home-screen');
        }

        initHome();
    </script>
</body>
</html>
