<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Scrabble</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f9; }
        #board { display: grid; grid-template-columns: repeat(7, 40px); gap: 5px; justify-content: center; margin: 20px; }
        .tile { width: 40px; height: 40px; background: #fff; border: 2px solid #ccc; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; }
        .tile.selected { background: #ffd700; }
        #word-display { font-size: 24px; margin: 10px; color: #333; min-height: 30px; }
        button { padding: 10px 20px; background: #0088cc; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Scrabble Mini</h2>
    <div id="word-display"></div>
    
    <div id="board">
        <!-- We will generate tiles here with JavaScript -->
    </div>

    <button onclick="submitWord()">Submit Word</button>
    <button onclick="clearWord()" style="background:#cc0000">Clear</button>

    <script>
        // Initialize Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Make the app full screen

        let currentWord = "";
        const letters = ["A", "P", "P", "L", "E", "S", "T"]; // Sample letters

        const board = document.getElementById('board');
        const display = document.getElementById('word-display');

        // Create the letter tiles
        letters.forEach(letter => {
            const div = document.createElement('div');
            div.className = 'tile';
            div.innerText = letter;
            div.onclick = () => {
                currentWord += letter;
                display.innerText = currentWord;
                div.style.display = 'none'; // Hide used tile
            };
            board.appendChild(div);
        });

        function clearWord() {
            currentWord = "";
            display.innerText = "";
            // Reset tiles (simple reload for now)
            location.reload();
        }

        async function submitWord() {
    if (currentWord.length < 2) return;

    // Show a "Loading" state so the user knows the app is thinking
    const display = document.getElementById('word-display');
    const originalWord = currentWord;
    display.innerText = "Checking...";

    try {
        // 1. The API Call: We "fetch" data from the dictionary server
        const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${originalWord}`);
        
        if (response.ok) {
            // 2. Success: The word exists!
            const score = originalWord.length * 10;
            alert("🔥 Legit! + " + score + " points.");
            
            tg.sendData(JSON.stringify({
                word: originalWord,
                score: score
            }));
        } else {
            // 3. 404 Error: The word is not in the dictionary
            alert("❌ '" + originalWord + "' isn't a real word, gamer.");
            clearWord();
        }
    } catch (error) {
        // 4. Network Error: If the API is down or there's no internet
        console.error("API Error:", error);
        alert("Server hiccup. Try again!");
    }
}
    </script>
</body>
</html>
