<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jin Scramble</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #word-display { font-size: 2rem; margin-bottom: 20px; border-bottom: 2px solid #fff; min-width: 150px; text-align: center; height: 2.5rem; }
        .controls { display: flex; gap: 10px; }
        button { padding: 10px 20px; font-size: 1rem; cursor: pointer; border: none; border-radius: 5px; }
        .submit-btn { background: #4caf50; color: white; }
        .clear-btn { background: #f44336; color: white; }
        .loading { color: #ffeb3b; font-size: 0.9rem; margin-top: 10px; visibility: hidden; }
    </style>
</head>
<body>

    <div id="word-display"></div>
    <div class="loading" id="loader">Checking dictionary...</div>

    <div class="controls">
        <button class="clear-btn" onclick="clearWord()">Clear</button>
        <button class="submit-btn" onclick="submitWord()">Submit</button>
    </div>

    <div style="margin-top: 20px; display: flex; gap: 5px;">
        <button onclick="addLetter('A')">A</button>
        <button onclick="addLetter('P')">P</button>
        <button onclick="addLetter('L')">L</button>
        <button onclick="addLetter('E')">E</button>
        <button onclick="addLetter('S')">S</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentWord = "";
        const display = document.getElementById('word-display');
        const loader = document.getElementById('loader');

        function addLetter(l) {
            currentWord += l;
            display.innerText = currentWord;
        }

        function clearWord() {
            currentWord = "";
            display.innerText = "";
        }

        // THE API LOGIC
        async function submitWord() {
            if (currentWord.length < 2) return;

            loader.style.visibility = "visible";

            try {
                // Fetching from the Free Dictionary API
                const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${currentWord.toLowerCase()}`);
                
                loader.style.visibility = "hidden";

                if (response.ok) {
                    const score = currentWord.length * 10;
                    alert(`🔥 "${currentWord}" is a real word! +${score} points.`);
                    
                    // Sending the score back to the Telegram Bot
                    tg.sendData(JSON.stringify({ word: currentWord, score: score }));
                } else {
                    alert(`❌ "${currentWord}" is not in the dictionary.`);
                    clearWord();
                }
            } catch (error) {
                loader.style.visibility = "hidden";
                console.error("API Error:", error);
                alert("Connection error. Is your internet on?");
            }
        }
    </script>
</body>
</html>
